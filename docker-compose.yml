version: '3.8'

services:
  backend:
    build: ./backend
    container_name: persona_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pharma_personas
      - DB_SCHEMA=persona
      # Add other keys from .env here or use env_file
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: persona_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pharma_personas
    ports:
      - "5435:5432" # Changed host port to 5435 to avoid conflict with local DB
    restart: unless-stopped

volumes:
  postgres_data:
